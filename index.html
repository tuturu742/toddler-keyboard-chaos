<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toddler Keyboard Chaos</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #exit-button {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      padding: 8px 14px;
      font: 14px/1.4 system-ui, sans-serif;
      cursor: pointer;
    }
    #exit-button.hidden {
      display: none;
    }
    #exit-ui {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border-radius: 6px;
      padding: 10px 14px;
      font: 14px/1.4 system-ui, sans-serif;
      display: none;
    }
    #exit-ui.visible {
      display: block;
    }
    #exit-ui input {
      font: inherit;
      padding: 4px 6px;
      margin: 0 4px;
      width: 90px;
    }
    #exit-ui button {
      font: inherit;
      padding: 4px 8px;
      cursor: pointer;
    }
    #exit-ui .status {
      color: #ff9;
      min-height: 1.2em;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <button id="exit-button" type="button">Exit</button>
  <div id="exit-ui" role="dialog" aria-label="Exit password">
    <span>Password:</span>
    <input id="password-input" type="password" autocomplete="off" />
    <button id="password-submit" type="button">OK</button>
    <div class="status" id="exit-status"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
